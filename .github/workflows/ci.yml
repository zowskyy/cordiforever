name: CI

# Deterministic verification offload. This workflow never runs model inference, never executes a frozen scorer or
# gate, and never writes experiment evidence. Frozen artifacts are verified read-only (scripts/verify_frozen_artifacts.py).

on:
  push:
    branches: [main, d3-v2-pre-freeze-verification]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  integrity:
    name: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Byte-exact storage is enforced (.gitattributes)
        run: grep -qx '\* -text' .gitattributes
      - name: Checkout is pristine
        run: test -z "$(git status --porcelain)"
      - name: Frozen evidence matches FROZEN_MANIFEST.json (read-only)
        run: python scripts/verify_frozen_artifacts.py --check manifest --report ci-reports/integrity-manifest.json
      - name: D3-v2 candidate, verification tooling and frozen-v1 hashes match the verification manifest
        # Gates every expensive job below, so results can never be reported for bytes other than the ones named.
        run: python scripts/verify_d3_v2_candidate.py --commit "$GITHUB_SHA" --report ci-reports/d3-v2-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrity-${{ github.sha }}
          path: ci-reports/
          retention-days: 30

  quality:
    name: quality
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (requirements.txt)
        run: python -m pip install -r requirements.txt
      - name: Compile sources (corpus and oracle excluded)
        run: python -m compileall -q -x '(^|/)benchmark/(repos|oracle)/' core plugins benchmark scripts tests main.py ui.py conftest.py
      - name: Import check
        run: python -c "import main, core.bounded_task, core.diagnosis, core.structured_edit, plugins.agent.loop, plugins.agent.schema_router, plugins.tools.file, benchmark.repo_task_eval; print('imports ok')"
      - name: Plugin security gate
        run: |
          mkdir -p ci-reports
          python scripts/verify_plugin_security.py | tee ci-reports/plugin-security.json
      - name: Ruff / mypy (not configured in this repository; not enforced)
        run: echo "No ruff or mypy configuration exists (no pyproject.toml, ruff.toml or mypy.ini); static linting and type checking are not run as gates."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ github.sha }}
          path: ci-reports/
          retention-days: 30

  tests:
    name: tests
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (requirements.txt)
        run: python -m pip install -r requirements.txt
      - name: Run deterministic test suite
        # pytest's exit code is intentionally not the verdict: the JUnit report is judged by scripts/ci_pytest_gate.py,
        # which fails on any failure outside the two documented environment-dependent tests (see baseline_gate.ps1).
        run: |
          mkdir -p ci-reports
          set +e
          python -m pytest -q -p no:cacheprovider --basetemp "$RUNNER_TEMP/pytest_cordii" --junitxml ci-reports/pytest.xml 2>&1 | tee ci-reports/pytest-output.txt
          echo "pytest_exit_code=${PIPESTATUS[0]}" | tee -a ci-reports/pytest-output.txt
          exit 0
      - name: Judge test results (known environment failures only)
        run: python scripts/ci_pytest_gate.py ci-reports/pytest.xml --summary ci-reports/pytest-summary.json --root .
      - name: Tests did not mutate tracked files or frozen evidence
        run: |
          git status --porcelain --untracked-files=no | tee ci-reports/post-test-git-status.txt
          test -z "$(git status --porcelain --untracked-files=no)"
          python scripts/verify_frozen_artifacts.py --check manifest --report ci-reports/post-test-manifest.json
      - name: Provenance
        if: always()
        run: >-
          python scripts/ci_provenance.py ci-reports/provenance.json
          --command "tests=python -m pytest -q -p no:cacheprovider --basetemp $RUNNER_TEMP/pytest_cordii --junitxml ci-reports/pytest.xml"
          --command "test_gate=python scripts/ci_pytest_gate.py ci-reports/pytest.xml"
          --command "research_validator=python scripts/validate_research_state.py"
          --command "skills_validator=python scripts/validate_skills.py"
          --command "artifact_checks=python scripts/verify_frozen_artifacts.py --check all"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ github.sha }}
          path: ci-reports/
          retention-days: 30

  # ---------------------------------------------------------------- D3-v2 pre-freeze verification (strict)
  # These three jobs verify a methodology CANDIDATE. They are strict: the known-environment-failure tolerance that
  # `tests` applies via scripts/ci_pytest_gate.py is deliberately NOT inherited here. Any nonzero exit fails the job,
  # including mutation infrastructure states (anchor_error, mutation_load_error, pytest_error, child_error).
  producer-contract:
    name: producer-contract
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (requirements.txt)
        run: python -m pip install -r requirements.txt
      - name: Producer round-contract suite
        run: |
          mkdir -p ci-reports
          python -m pytest -q -p no:cacheprovider --basetemp "$RUNNER_TEMP/pytest_producer" \
            tests/test_producer_call_round_contract.py --junitxml ci-reports/producer-contract.xml
      - name: Every producer-generated row satisfies D3_PRODUCER_ENVELOPE_CONTRACT (synthetic only)
        run: >-
          python benchmark/analysis/furthest_bottleneck_v2_producer_envelope_check.py
          --trials 4000 --seed 20260915 --commit "$GITHUB_SHA"
          --report ci-reports/producer-envelope.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: producer-contract-${{ github.sha }}
          path: ci-reports/
          retention-days: 30

  mutation:
    name: mutation
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (requirements.txt)
        run: python -m pip install -r requirements.txt
      - name: D3-v2 mutation suite (sequential by design; no intra-job parallelism)
        env:
          FB_V2_BASETEMP: ${{ runner.temp }}/fb_v2_mutations
        run: |
          mkdir -p ci-reports
          set -o pipefail
          python benchmark/analysis/furthest_bottleneck_v2_mutations.py | tee ci-reports/mutation.txt
      - name: No infrastructure state was scored as a kill
        run: |
          ! grep -Eq 'anchor_error|mutation_load_error|pytest_error|child_error|harness_error' ci-reports/mutation.txt
          grep -q '^mutations: OK$' ci-reports/mutation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ github.sha }}
          path: ci-reports/
          retention-days: 30

  mnt09-applicability:
    name: mnt09-applicability
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (requirements.txt)
        run: python -m pip install -r requirements.txt
      - name: MNT-09 admission suite and historical identity (Level A and Level B)
        run: |
          mkdir -p ci-reports
          set -o pipefail
          python -m pytest -q -p no:cacheprovider --basetemp "${{ runner.temp }}/mnt09" \
            tests/test_taxonomy_population_registry_v1.py \
            tests/test_taxonomy_population_registry_v1_mutations.py \
            tests/test_taxonomy_population_registry_v1_historical_identity.py | tee ci-reports/mnt09-tests.txt
      - name: MNT-09 mutation suite (sequential by design; no intra-job parallelism)
        env:
          MNT09_BASETEMP: ${{ runner.temp }}/mnt09_mutations
        run: |
          set -o pipefail
          python benchmark/analysis/taxonomy_population_registry_v1_mutations.py | tee ci-reports/mnt09-mutation.txt
      - name: No infrastructure state was scored as a kill
        run: |
          ! grep -Eq 'anchor_error|mutation_load_error|pytest_error|child_error|harness_error' ci-reports/mnt09-mutation.txt
          grep -q '^mutations: OK$' ci-reports/mnt09-mutation.txt
      - name: Frozen MNT-07/MNT-08 artifacts and preserved outputs were not mutated
        run: |
          git status --porcelain --untracked-files=no | tee ci-reports/mnt09-post-git-status.txt
          test -z "$(git status --porcelain --untracked-files=no)"
          python scripts/verify_frozen_artifacts.py --check logged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mnt09-applicability-${{ github.sha }}
          path: ci-reports/
          retention-days: 30

  s2-methodology:
    name: s2-methodology
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (requirements.txt)
        run: python -m pip install -r requirements.txt
      - name: S2 suites (paired substrate, MNT-09 boundary, harness delta, resource monitor, MV-01)
        run: |
          mkdir -p ci-reports
          set -o pipefail
          python -m pytest -q -p no:cacheprovider --basetemp "${{ runner.temp }}/s2" \
            tests/test_paired_substrate_v1.py \
            tests/test_paired_substrate_mnt09_boundary.py \
            tests/test_paired_substrate_v1_mutations.py \
            tests/test_harness_delta_contract.py \
            tests/test_resource_monitor_v1.py | tee ci-reports/s2-tests.txt
      - name: Paired-substrate mutation suite (sequential by design; no intra-job parallelism)
        env:
          PSV1_BASETEMP: ${{ runner.temp }}/psv1_mutations
        run: |
          set -o pipefail
          python benchmark/analysis/paired_substrate_v1_mutations.py | tee ci-reports/s2-mutation.txt
      - name: No infrastructure state was scored as a kill
        run: |
          ! grep -Eq 'anchor_error|mutation_load_error|pytest_error|child_error|harness_error' ci-reports/s2-mutation.txt
          grep -q '^mutations: OK$' ci-reports/s2-mutation.txt
      - name: MNT-09 historical Level-B identity still holds after the evaluator delta
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider --basetemp "${{ runner.temp }}/s2_levelb" \
            tests/test_taxonomy_population_registry_v1_historical_identity.py | tee ci-reports/s2-level-b.txt
      - name: MV-02 v2.1 suites (injected/fake machinery only)
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider --basetemp "${{ runner.temp }}/mv02" \
            tests/test_mv02_stats.py tests/test_mv02a.py tests/test_mv02b.py tests/test_mv02b_policy_isolation.py \
            tests/test_mv02c_local.py tests/test_mv02_combined_reachability.py tests/test_mv02_vacuity.py \
            tests/test_mv02_spec_pin.py tests/test_mv02_mutations.py | tee ci-reports/mv02-tests.txt
      - name: MV-02C C1-C10 against frozen resource_monitor_v1 (evidence written before the semantic exit)
        id: mv02c
        if: always()
        run: |
          mkdir -p ci-reports/mv02c
          set +e
          python scripts/monitor_validity_v2/mv02c_enforcement.py --out-dir ci-reports/mv02c | tee ci-reports/mv02c/mv02c-stdout.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" | tee ci-reports/mv02c/mv02c-exit.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Classify MV-02C status (PASS / FAIL / INVALID / ORCHESTRATION_FAILURE)
        if: always()
        run: |
          mkdir -p ci-reports/mv02c
          python scripts/monitor_validity_v2/mv02c_enforcement.py --out-dir ci-reports/mv02c \
            --classify-exit-code "${{ steps.mv02c.outputs.exit_code || 99 }}" | tee ci-reports/mv02c/mv02c-status.txt
      - name: MV-02 mutation suite (local group, sequential)
        if: always()
        env:
          MV02_MUT_BASETEMP: ${{ runner.temp }}/mv02_mutations
        run: |
          set -o pipefail
          python scripts/monitor_validity_v2/mutations.py --group local | tee ci-reports/mv02-mutation-local.txt
          ! grep -Eq 'anchor_error|mutation_load_error|pytest_error|child_error|harness_error' ci-reports/mv02-mutation-local.txt
          grep -q '^mutations: OK$' ci-reports/mv02-mutation-local.txt
      - name: MV-02 frozen v1 in-memory mutations against their target C cases
        if: always()
        run: |
          set -o pipefail
          python scripts/monitor_validity_v2/mutations.py --group v1 | tee ci-reports/mv02-mutation-v1.txt
          ! grep -Eq 'anchor_error|mutation_load_error|pytest_error|child_error|harness_error' ci-reports/mv02-mutation-v1.txt
          grep -q '^mutations: OK$' ci-reports/mv02-mutation-v1.txt
      - name: Frozen artifacts and preserved outputs were not mutated
        run: |
          git status --porcelain --untracked-files=no | tee ci-reports/s2-post-git-status.txt
          test -z "$(git status --porcelain --untracked-files=no)"
          python scripts/verify_frozen_artifacts.py --check logged
      - name: MV-02C semantic gate (fails the job unless C PASS; evidence already materialized)
        if: always()
        run: grep -qx 'C_STATUS=PASS' ci-reports/mv02c/mv02c-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2-methodology-${{ github.sha }}
          path: ci-reports/
          retention-days: 30

  property-search:
    name: property-search
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (requirements.txt)
        run: python -m pip install -r requirements.txt
      - name: Valid-domain differential search (synthetic rows only; no experiment data is read)
        run: >-
          python benchmark/analysis/furthest_bottleneck_v2_property_search.py
          --population standard --commit "$GITHUB_SHA"
          --report ci-reports/property-search.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: property-search-${{ github.sha }}
          path: ci-reports/
          retention-days: 30

  project-validation:
    name: project-validation
    needs: [quality, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Research-state validator (RESEARCH_YIELD / EXPERIMENT_LOG / DECISIONS / PROJECT_TRACKING)
        run: |
          mkdir -p ci-reports
          set -o pipefail
          python scripts/validate_research_state.py . | tee ci-reports/research-state.txt
      - name: Skill registry validator (skills/registry.yaml and SKILL.md contracts)
        run: |
          mkdir -p ci-reports
          set -o pipefail
          python scripts/validate_skills.py . | tee ci-reports/skills.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-validation-${{ github.sha }}
          path: ci-reports/
          retention-days: 30

  verification-report:
    name: verification-report
    needs: [integrity, quality, tests, producer-contract, mutation, property-search]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: collected
      - name: Summarize the D3-v2 pre-freeze verification evidence
        run: |
          mkdir -p ci-reports
          {
            echo "D3-v2 PRE-FREEZE VERIFICATION — NOT A FREEZE"
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID"
            echo "jobs: integrity, quality, tests, producer-contract, mutation, property-search all green"
          } | tee ci-reports/verification-summary.txt
          find collected -name '*.json' -o -name 'mutation.txt' | sort | tee -a ci-reports/verification-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report-${{ github.sha }}
          path: |
            ci-reports/
            collected/
          retention-days: 30

  artifact-checks:
    name: artifact-checks
    needs: project-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify frozen evidence (manifest, logged hashes, scorer outputs, run rows) without executing scorers
        run: python scripts/verify_frozen_artifacts.py --check all --report ci-reports/artifact-checks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifact-checks-${{ github.sha }}
          path: ci-reports/
          retention-days: 30
